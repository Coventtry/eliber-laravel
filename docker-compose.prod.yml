services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eliber-app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      APP_ENV: production
    volumes:
      - ./.env:/var/www/.env:ro
      - ./storage:/var/www/storage
      - ./bootstrap/cache:/var/www/bootstrap/cache
    networks:
      - eliber-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t 2>/dev/null && echo ok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  web:
    image: nginx:alpine
    container_name: eliber-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8005:80"
    volumes:
      - ./public:/var/www/public:ro
      - ./storage/app/public:/var/www/storage_public:ro
      - ./docker/nginx/eliber.conf:/etc/nginx/conf.d/default.conf
    networks:
      - eliber-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: eliber-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - eliber_db_data:/var/lib/mysql
    networks:
      - eliber-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eliber-queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    working_dir: /var/www
    volumes:
      - ./.env:/var/www/.env:ro
      - ./storage:/var/www/storage
    networks:
      - eliber-network
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eliber-scheduler
    restart: unless-stopped
    command: ["sh", "-c", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    working_dir: /var/www
    volumes:
      - ./.env:/var/www/.env:ro
      - ./storage:/var/www/storage
    networks:
      - eliber-network
    depends_on:
      db:
        condition: service_healthy

networks:
  eliber-network:
    driver: bridge

volumes:
  eliber_db_data:
    driver: local
